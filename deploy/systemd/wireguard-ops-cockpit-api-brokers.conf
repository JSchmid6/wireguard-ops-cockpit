[Unit]
After=wireguard-ops-cockpit-agent.service wireguard-ops-cockpit-runner.service wireguard-ops-cockpit-executor.service
Requires=wireguard-ops-cockpit-agent.service wireguard-ops-cockpit-runner.service wireguard-ops-cockpit-executor.service

[Service]
SupplementaryGroups=cockpit-agent-client cockpit-runner-client cockpit-executor-client
# The runner role goes only to its own broker (card t_cb81637b); without this the
# API refuses to start a runner instead of sending it to the plan roles' broker.
Environment=COCKPIT_RUNNER_BROKER_SOCKET=/run/cockpit-runner/runner.sock
