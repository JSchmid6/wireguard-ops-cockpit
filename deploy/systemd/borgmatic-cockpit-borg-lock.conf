# /etc/systemd/system/borgmatic.service.d/cockpit-borg-lock.conf
#
# Installiert von deploy/vps/vps-cockpit-deploy.sh (Tabelle) — bitte nicht von
# Hand ändern: der nächste Deploy schreibt die Datei neu, und sein Rückfall nimmt
# sie wieder weg (bzw. stellt den vorherigen Stand her).
#
# Zweiter Riegel gegen die Kollision von Wartung und Backup: `flock` ohne -n
# blockiert, bis die Repo-Sperre /run/lock/cockpit-borg.lock frei ist, und läuft
# danach /bin/true (rc=0). Ein `check`/`repair` über das ganze Repo, das die
# 8-h-Frist in cockpit-borg-action passiert hat und dann doch länger dauert als
# gedacht, lässt das nächtliche Backup also WARTEN statt an der Sperre zu
# scheitern (genau das passierte am 22.09.2026). borgmatic.service ist
# Type=oneshot und hat damit keinen Start-Timeout — Warten kostet hier nichts.
#
# ExecStartPre-Einträge mehrerer Drop-ins gelten nebeneinander; diese Datei
# ändert nichts an fremden Drop-ins in diesem Verzeichnis (z. B.
# nach-gitlab-backup.conf).
[Service]
ExecStartPre=/usr/bin/flock /run/lock/cockpit-borg.lock /bin/true
