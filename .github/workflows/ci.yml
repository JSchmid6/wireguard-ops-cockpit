name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  # The api safety review reads the actual runbook scripts below the repository
  # root (buildRunbookSafetyPrompt). Production defaults to
  # /opt/wireguard-ops-cockpit; on a runner the checkout is the repository root.
  COCKPIT_REPO_ROOT: ${{ github.workspace }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pinned Node runtime
        # bin/with-runtime (used by `npm test`) runs commands on the exact
        # runtime the systemd services are pinned to: /opt/node-v<version>-linux-x64,
        # with <version> read from .node-version. Install that runtime here so
        # the tests run on the same Node major as production instead of failing
        # closed when the directory does not exist.
        run: |
          set -euo pipefail
          version="$(tr -d ' \n\r\t' < .node-version)"
          target="/opt/node-v${version}-linux-x64"
          if [ -x "${target}/bin/node" ]; then
            echo "pinned Node ${version} already installed at ${target}"
          else
            tarball="node-v${version}-linux-x64.tar.xz"
            base="https://nodejs.org/dist/v${version}"
            curl -fsSLo "${RUNNER_TEMP}/${tarball}" "${base}/${tarball}"
            curl -fsSLo "${RUNNER_TEMP}/SHASUMS256.txt" "${base}/SHASUMS256.txt"
            (cd "${RUNNER_TEMP}" && grep " ${tarball}\$" SHASUMS256.txt | sha256sum -c -)
            sudo tar -xJf "${RUNNER_TEMP}/${tarball}" -C /opt
          fi
          echo "${target}/bin" >> "$GITHUB_PATH"

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # `npm ci` streams to the job log and into a file; the next step gates
      # the file for `npm warn` lines. (npm logs to stderr — merge both.)
      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "${RUNNER_TEMP}/npm-ci.log"

      # Fail the job on every `npm warn` line that is not a labeled exception in
      # .github/npm-warn-allowlist.txt — see .github/scripts/check-npm-warnings.sh.
      - name: Gate npm ci warnings
        run: bash .github/scripts/check-npm-warnings.sh "${RUNNER_TEMP}/npm-ci.log"

      - name: Build and test workspaces
        run: npm run check

      - name: Enforce coverage thresholds
        run: npm run coverage
